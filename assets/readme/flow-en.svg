<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 206" width="1120" height="206" role="img" aria-labelledby="title desc">
<title id="title">From selection to file</title><desc id="desc">Select media Use the page control or browser menu. Check the source Match the item to its post and check the file. Save the file Apply the folder rules for the selected destination. Find it again Open the file or source from Downloads.</desc>
<defs><radialGradient id="glow" cx="76%" cy="0%" r="92%"><stop stop-color="#271018"/><stop offset="1" stop-color="#09090b"/></radialGradient></defs>
<g font-family="Segoe UI, system-ui, sans-serif"><rect x="1" y="1" width="1118" height="204" rx="20" fill="url(#glow)" stroke="#313137"/>
<text x="29" y="53" fill="#f4f4f5" font-size="29" font-weight="700">From selection to file</text><rect x="28" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="42" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Select media</text><text x="42" y="137" fill="#a6a6af" font-size="14" font-weight="500">Use the page control</text><text x="42" y="158" fill="#a6a6af" font-size="14" font-weight="500">or browser menu.</text><rect x="296" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="310" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Check the source</text><text x="310" y="137" fill="#a6a6af" font-size="14" font-weight="500">Match the item to its post</text><text x="310" y="158" fill="#a6a6af" font-size="14" font-weight="500">and check the file.</text><rect x="564" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="578" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Save the file</text><text x="578" y="137" fill="#a6a6af" font-size="14" font-weight="500">Apply the folder rules</text><text x="578" y="158" fill="#a6a6af" font-size="14" font-weight="500">for the selected destination.</text><rect x="832" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="846" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Find it again</text><text x="846" y="137" fill="#a6a6af" font-size="14" font-weight="500">Open the file or source</text><text x="846" y="158" fill="#a6a6af" font-size="14" font-weight="500">from Downloads.</text></g></svg>
