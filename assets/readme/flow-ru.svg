<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 206" width="1120" height="206" role="img" aria-labelledby="title desc">
<title id="title">От выбора до файла</title><desc id="desc">Выберите медиа Используйте кнопку на странице или меню браузера. Проверка источника MediaLatch сверит публикацию и проверит файл. Сохранение Файл попадёт в выбранное хранилище по вашим правилам. Открытие результата Вернитесь к файлу или посту из списка загрузок.</desc>
<defs><radialGradient id="glow" cx="76%" cy="0%" r="92%"><stop stop-color="#271018"/><stop offset="1" stop-color="#09090b"/></radialGradient></defs>
<g font-family="Segoe UI, system-ui, sans-serif"><rect x="1" y="1" width="1118" height="204" rx="20" fill="url(#glow)" stroke="#313137"/>
<text x="29" y="53" fill="#f4f4f5" font-size="29" font-weight="700">От выбора до файла</text><rect x="28" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="42" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Выберите медиа</text><text x="42" y="137" fill="#a6a6af" font-size="14" font-weight="500">Используйте кнопку на странице</text><text x="42" y="158" fill="#a6a6af" font-size="14" font-weight="500">или меню браузера.</text><rect x="296" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="310" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Проверка источника</text><text x="310" y="137" fill="#a6a6af" font-size="14" font-weight="500">MediaLatch сверит публикацию</text><text x="310" y="158" fill="#a6a6af" font-size="14" font-weight="500">и проверит файл.</text><rect x="564" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="578" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Сохранение</text><text x="578" y="137" fill="#a6a6af" font-size="14" font-weight="500">Файл попадёт в выбранное</text><text x="578" y="158" fill="#a6a6af" font-size="14" font-weight="500">хранилище по вашим правилам.</text><rect x="832" y="77" width="260" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="846" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Открытие результата</text><text x="846" y="137" fill="#a6a6af" font-size="14" font-weight="500">Вернитесь к файлу или посту</text><text x="846" y="158" fill="#a6a6af" font-size="14" font-weight="500">из списка загрузок.</text></g></svg>
