<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 206" width="1120" height="206" role="img" aria-labelledby="title desc">
<title id="title">Установка MediaLatch</title><desc id="desc">Chrome Web Store Установка и обновления через магазин расширений. GitHub Releases Подписанный CRX с проверкой SHA-256. Правила браузера Ручная установка зависит от вашего Chromium-браузера.</desc>
<defs><radialGradient id="glow" cx="76%" cy="0%" r="92%"><stop stop-color="#271018"/><stop offset="1" stop-color="#09090b"/></radialGradient></defs>
<g font-family="Segoe UI, system-ui, sans-serif"><rect x="1" y="1" width="1118" height="204" rx="20" fill="url(#glow)" stroke="#313137"/>
<text x="29" y="53" fill="#f4f4f5" font-size="29" font-weight="700">Установка MediaLatch</text><rect x="28" y="77" width="344" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="42" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Chrome Web Store</text><text x="42" y="137" fill="#a6a6af" font-size="14" font-weight="500">Установка и обновления</text><text x="42" y="158" fill="#a6a6af" font-size="14" font-weight="500">через магазин расширений.</text><rect x="380" y="77" width="344" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="394" y="106" fill="#f4f4f5" font-size="17" font-weight="650">GitHub Releases</text><text x="394" y="137" fill="#a6a6af" font-size="14" font-weight="500">Подписанный CRX</text><text x="394" y="158" fill="#a6a6af" font-size="14" font-weight="500">с проверкой SHA-256.</text><rect x="732" y="77" width="344" height="109" rx="12" fill="#161619" stroke="#34343b"/><text x="746" y="106" fill="#f4f4f5" font-size="17" font-weight="650">Правила браузера</text><text x="746" y="137" fill="#a6a6af" font-size="14" font-weight="500">Ручная установка зависит</text><text x="746" y="158" fill="#a6a6af" font-size="14" font-weight="500">от вашего Chromium-браузера.</text></g></svg>
